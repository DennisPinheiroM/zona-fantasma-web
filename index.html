<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0e110d">
		<title>Ghost Outpost</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
		<style>
/* Tela de carregamento do Ghost Outpost: o mesmo traco do jogo (contorno de tinta,
   cor chapada, sombra dura, costura tracejada) e a imagem da camera do drone. */
:root {
	--tinta: #101216;
	--creme: #ede8d6;
	--ambar: #f5c64d;
	--oliva: #2e3a2a;
	--fundo: #0e110d;
	--dim: rgba(237, 232, 214, 0.58);
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--creme);
	background-color: var(--fundo);
	overflow: hidden;
	touch-action: none;
	font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 3.2vmin;
	visibility: hidden;
	z-index: 2;
	/* carta militar escura: grade e curvas de nivel */
	background:
		radial-gradient(ellipse at 70% 45%, rgba(245, 198, 77, 0.07), transparent 55%),
		repeating-radial-gradient(circle at 30% 70%, transparent 0 46px, rgba(237, 232, 214, 0.035) 46px 48px),
		linear-gradient(rgba(237, 232, 214, 0.04) 1px, transparent 1px) 0 0 / 120px 120px,
		linear-gradient(90deg, rgba(237, 232, 214, 0.04) 1px, transparent 1px) 0 0 / 120px 120px,
		var(--fundo);
	animation: deriva 60s linear infinite;
}

@keyframes deriva {
	to { background-position: 0 0, 0 0, 120px 60px, 120px 60px, 0 0; }
}

/* cantos da camera do drone e telemetria */
.canto {
	position: absolute;
	width: 8vmin;
	height: 8vmin;
	border: 0.5vmin solid rgba(237, 232, 214, 0.34);
}
.canto.a { top: 3vmin; left: 3vmin; border-right: 0; border-bottom: 0; }
.canto.b { top: 3vmin; right: 3vmin; border-left: 0; border-bottom: 0; }
.canto.c { bottom: 3vmin; left: 3vmin; border-right: 0; border-top: 0; }
.canto.d { bottom: 3vmin; right: 3vmin; border-left: 0; border-top: 0; }

#telemetria {
	position: absolute;
	top: 4.4vmin;
	right: 6vmin;
	font-size: max(14px, 2.4vmin);
	letter-spacing: 0.06em;
	color: rgba(237, 232, 214, 0.45);
}
#telemetria i {
	display: inline-block;
	width: 1.4vmin;
	height: 1.4vmin;
	border-radius: 50%;
	background: #ff5c48;
	margin-left: 0.8vmin;
	animation: pisca 1.4s steps(1) infinite;
}
@keyframes pisca { 50% { opacity: 0; } }

/* mira que passeia pela carta */
#mira {
	position: absolute;
	width: 22vmin;
	height: 22vmin;
	left: 62%;
	top: 30%;
	pointer-events: none;
	animation: patrulha 9s ease-in-out infinite;
}
#mira::before, #mira::after {
	content: '';
	position: absolute;
	inset: 0;
	border: 0.6vmin solid rgba(143, 240, 196, 0.55);
	clip-path: polygon(0 0, 28% 0, 28% 6%, 6% 6%, 6% 28%, 0 28%, 0 72%, 6% 72%, 6% 94%, 28% 94%, 28% 100%, 72% 100%, 72% 94%, 94% 94%, 94% 72%, 100% 72%, 100% 28%, 94% 28%, 94% 6%, 72% 6%, 72% 0, 100% 0, 100% 100%, 0 100%);
}
#mira::after {
	border: 0;
	clip-path: none;
	width: 1.4vmin;
	height: 1.4vmin;
	border-radius: 50%;
	background: rgba(143, 240, 196, 0.7);
	inset: auto;
	left: calc(50% - 0.7vmin);
	top: calc(50% - 0.7vmin);
}
@keyframes patrulha {
	0%, 100% { transform: translate(0, 0); }
	30% { transform: translate(-38vw, 18vh); }
	55% { transform: translate(-12vw, 34vh); }
	80% { transform: translate(14vw, 8vh); }
}

/* logo: GH [emblema] ST, e OUTPOST na faixa ambar */
#logo {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: stretch;
	transform: rotate(-1.2deg);
	animation: carimbo 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) 0.1s both;
}
@keyframes carimbo {
	from { transform: rotate(-1.2deg) scale(1.25); opacity: 0; }
}
#ghost {
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: 'Bungee', 'Impact', sans-serif;
	font-size: min(17vmin, 15vw);
	line-height: 1;
	color: var(--creme);
	-webkit-text-stroke: 0.09em var(--tinta);
	paint-order: stroke fill;
	text-shadow: 0.06em 0.08em 0 rgba(16, 18, 22, 0.8);
}
#ghost span:nth-child(1) { transform: rotate(-4deg); display: inline-block; }
#ghost span:nth-child(2) { transform: rotate(3deg) translateY(-0.05em); display: inline-block; }
#ghost span:nth-child(4) { transform: rotate(-2deg) translateY(0.03em); display: inline-block; }
#ghost span:nth-child(5) { transform: rotate(5deg); display: inline-block; }
#emblema {
	width: 1.05em;
	height: 1.05em;
	margin: 0 0.04em;
	transform: rotate(7deg);
	animation: respira 3.2s ease-in-out infinite;
	filter: drop-shadow(0.04em 0.06em 0 rgba(16, 18, 22, 0.7));
}
@keyframes respira { 50% { transform: rotate(7deg) translateY(-0.04em); } }
#faixa {
	margin-top: -0.3vmin;
	background: var(--ambar);
	border: 0.6vmin solid var(--tinta);
	box-shadow: 1vmin 1.4vmin 0 rgba(16, 18, 22, 0.75);
	clip-path: polygon(2.4vmin 0, calc(100% - 2.4vmin) 0, 100% 2.4vmin, 100% calc(100% - 2.4vmin), calc(100% - 2.4vmin) 100%, 2.4vmin 100%, 0 calc(100% - 2.4vmin), 0 2.4vmin);
	text-align: center;
	font-family: 'Bungee', 'Impact', sans-serif;
	font-size: min(9.6vmin, 8.6vw);
	letter-spacing: 0.13em;
	color: var(--tinta);
	padding: 0.4vmin 0 0.4vmin 0.13em;
	transform: rotate(-1.4deg);
}

/* barra de progresso: remendo costurado que enche de ambar */
#barra {
	position: relative;
	width: min(62vmin, 80vw);
	height: 4.6vmin;
	min-height: 22px;
	background: rgba(5, 6, 5, 0.75);
	border: 0.5vmin solid var(--tinta);
	outline: 2px dashed rgba(245, 198, 77, 0.45);
	outline-offset: -1.2vmin;
	clip-path: polygon(1.4vmin 0, 100% 0, 100% calc(100% - 1.4vmin), calc(100% - 1.4vmin) 100%, 0 100%, 0 1.4vmin);
	margin-top: 2vmin;
}
#cheio {
	position: absolute;
	inset: 0;
	width: 0%;
	background: var(--ambar);
	transition: width 0.25s ease-out;
}
#cheio.sem-total {
	width: 30% !important;
	animation: vai-e-volta 1.4s ease-in-out infinite alternate;
}
@keyframes vai-e-volta { from { left: 0; } to { left: 70%; } }
#estado {
	font-size: max(16px, 2.8vmin);
	letter-spacing: 0.14em;
	color: var(--dim);
}
#dica {
	max-width: min(80vmin, 88vw);
	min-height: 3.4em;
	text-align: center;
	font-size: max(16px, 3vmin);
	line-height: 1.3;
	color: var(--creme);
	transition: opacity 0.4s;
}
#dica b {
	color: var(--ambar);
	font-weight: 600;
	letter-spacing: 0.06em;
}

#status-notice {
	display: none;
	max-width: 80vw;
	background: #3a1a18;
	border: 0.5vmin solid var(--tinta);
	outline: 2px dashed rgba(255, 92, 72, 0.6);
	outline-offset: -1.2vmin;
	color: var(--creme);
	line-height: 1.35;
	padding: 2.4vmin 3.4vmin;
	text-align: center;
	font-size: max(16px, 2.8vmin);
}

#celular {
	display: none;
	position: absolute;
	bottom: 4vmin;
	left: 50%;
	transform: translateX(-50%);
	color: var(--ambar);
	font-size: max(16px, 2.8vmin);
	text-decoration: none;
	border-bottom: 2px dashed rgba(245, 198, 77, 0.6);
	z-index: 3;
}

/* celular em pe: pede para girar (o jogo e deitado) */
#girar {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background: var(--fundo);
	color: var(--creme);
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 5vmin;
	text-align: center;
	font-size: max(18px, 5vmin);
	padding: 0 8vw;
}
#girar .aparelho {
	width: 18vmin;
	height: 30vmin;
	border: 1.4vmin solid var(--creme);
	border-radius: 3vmin;
	position: relative;
	animation: gira 2.2s ease-in-out infinite;
}
#girar .aparelho::after {
	content: '';
	position: absolute;
	left: 30%;
	right: 30%;
	bottom: 1.6vmin;
	height: 1vmin;
	border-radius: 1vmin;
	background: var(--ambar);
}
@keyframes gira { 40%, 70% { transform: rotate(-90deg); } }
@media (orientation: portrait) {
	body.celular #girar { display: flex; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Seu navegador não mostra o jogo (falta suporte a canvas).
		</canvas>

		<noscript>
			Ative o JavaScript para jogar.
		</noscript>

		<div id="status">
			<div class="canto a"></div><div class="canto b"></div><div class="canto c"></div><div class="canto d"></div>
			<div id="telemetria">DRONE 02 &nbsp; ALT 120 M &nbsp; GRAV<i></i></div>
			<div id="mira"></div>
			<div id="logo">
				<div id="ghost"><span>G</span><span>H</span><img id="emblema" src="index.png" alt=""><span>S</span><span>T</span></div>
				<div id="faixa">OUTPOST</div>
			</div>
			<div id="barra"><div id="cheio"></div></div>
			<div id="estado">PREPARANDO A MISSÃO</div>
			<div id="dica"></div>
			<div id="status-notice"></div>
			<a id="celular" href="mobile/">No celular? Jogue a versão para toque</a>
		</div>

		<div id="girar">
			<div class="aparelho"></div>
			<div>Gire o celular para jogar deitado</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17263236,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const NO_CELULAR = window.ZF_MOBILE === true;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const cheio = document.getElementById('cheio');
	const estado = document.getElementById('estado');
	const dica = document.getElementById('dica');

	if (NO_CELULAR) {
		document.body.classList.add('celular');
	} else if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
		// versao de PC aberta num aparelho de toque: oferece a versao mobile
		document.getElementById('celular').style.display = 'block';
	}

	// dicas do jogo, uma de cada vez enquanto carrega
	const DICAS = [
		'<b>DRONE</b> · reconheça o posto antes de entrar. Inimigo marcado mostra o cone de visão.',
		'<b>CAPIM ALTO</b> · agachado, você some da vista de quem passa.',
		'<b>CORPOS</b> · quem acha um corpo dá o alarme. Arraste e esconda.',
		'<b>PAINEL</b> · sabote o painel antes que um guarda corra para ele.',
		'<b>PEDRA</b> · o barulho chama o guarda para longe do seu caminho.',
		'<b>ALARME</b> · com a sirene tocando, chegam reforços de caminhão.',
		'<b>FACA</b> · chegue por trás: elimina em silêncio.',
		'<b>EM EQUIPE</b> · convide um amigo pela sala da equipe e jogue junto.',
	];
	let iDica = Math.floor(Math.random() * DICAS.length);
	function trocarDica() {
		dica.style.opacity = 0;
		setTimeout(() => {
			dica.innerHTML = DICAS[iDica];
			dica.style.opacity = 1;
			iDica = (iDica + 1) % DICAS.length;
		}, 400);
	}
	trocarDica();
	const relogioDica = setInterval(trocarDica, 4200);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(relogioDica);
			statusOverlay.style.transition = 'opacity 0.5s';
			statusOverlay.style.opacity = 0;
			setTimeout(() => statusOverlay.remove(), 520);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		document.getElementById('barra').style.display = mode === 'progress' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		estado.textContent = 'NÃO DEU PARA ABRIR O JOGO';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Aconteceu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Este navegador não tem o que o jogo precisa:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const p = Math.min(100, Math.round(current * 100 / total));
					cheio.classList.remove('sem-total');
					cheio.style.width = p + '%';
					estado.textContent = p < 100 ? 'CARREGANDO ' + p + '%' : 'ABRINDO O POSTO';
				} else {
					cheio.classList.add('sem-total');
					estado.textContent = 'CARREGANDO';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
